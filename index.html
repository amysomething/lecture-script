<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>報告講稿｜袁翊庭</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #F5F3EE; color: #1A1A1A; min-height: 100vh; }

  #timer-bar {
    position: sticky; top: 0; z-index: 100;
    background: #fff;
    border-bottom: 1px solid #E5E2DA;
    padding: 10px 12px 8px;
  }

  .timer-row {
    display: flex; gap: 8px; margin-bottom: 8px;
  }

  .timer-box {
    flex: 1;
    background: #F5F3EE;
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
  }

  .timer-label {
    font-size: 10px; font-weight: 600;
    color: #888;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .timer-value {
    font-size: 26px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    color: #1A1A1A;
  }

  .timer-value.warn { color: #B86A00; }
  .timer-value.over { color: #C0392B; }
  .timer-value.good { color: #2E7D57; }

  .progress-wrap { height: 3px; background: #E5E2DA; border-radius: 2px; margin-top: 3px; }
  .progress-bar { height: 3px; border-radius: 2px; transition: width 1s linear, background 0.5s; width: 0%; }
  #bar-total { background: #2E7D57; }
  #bar-suggest { background: #2E7D57; }

  .ctrl-row { display: flex; gap: 8px; }
  .ctrl-btn {
    flex: 1;
    font-size: 15px; font-weight: 500;
    padding: 8px;
    border-radius: 10px;
    border: 1.5px solid #C8C5BC;
    background: transparent;
    color: #1A1A1A;
    cursor: pointer;
    -webkit-user-select: none;
  }
  .ctrl-btn:active { background: #EDEAE3; }
  #btn-start { border-color: #2E7D57; color: #2E7D57; }
  #btn-start.paused { border-color: #B86A00; color: #B86A00; }

  #slide-nav {
    display: flex; align-items: center;
    padding: 10px 12px; gap: 8px;
    background: #F5F3EE;
  }
  .nav-btn {
    font-size: 14px; font-weight: 500;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid #C8C5BC;
    background: #fff;
    color: #1A1A1A;
    cursor: pointer;
    -webkit-user-select: none;
  }
  .nav-btn:active { background: #EDEAE3; }
  .nav-btn:disabled { opacity: 0.3; pointer-events: none; }
  #slide-counter { flex: 1; text-align: center; font-size: 13px; color: #888; }
  #btn-next { background: #2E7D57; color: #fff; border-color: #2E7D57; }
  #btn-next:active { background: #235F43; }

  #card {
    margin: 0 12px 20px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid #E5E2DA;
    overflow: hidden;
  }
  #card-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid #F0EDE6;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  #card-part { font-size: 11px; font-weight: 600; color: #2E7D57; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  #card-title { font-size: 20px; font-weight: 600; color: #1A1A1A; line-height: 1.3; }
  #card-time-badge { font-size: 12px; color: #999; background: #F5F3EE; padding: 4px 10px; border-radius: 20px; white-space: nowrap; margin-left: 10px; margin-top: 2px; }

  #script-wrap { padding: 16px 16px 14px; border-bottom: 1px solid #F0EDE6; }
  #script-label { font-size: 11px; font-weight: 600; color: #B86A00; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  #script { font-size: 17px; line-height: 1.85; color: #1A1A1A; }

  #cues-wrap { padding: 12px 16px 16px; }
  #cues-label { font-size: 11px; font-weight: 600; color: #888; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .cue { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; background: #F5F3EE; border-radius: 10px; margin-bottom: 6px; font-size: 15px; color: #3A3A3A; line-height: 1.5; }
  .cue-dot { flex-shrink: 0; width: 6px; height: 6px; border-radius: 50%; background: #2E7D57; margin-top: 7px; }

  #bottom-pad { height: 40px; }
</style>
</head>
<body>

<div id="timer-bar">
  <div class="timer-row">
    <div class="timer-box">
      <div class="timer-label">報告總時間</div>
      <div class="timer-value" id="clock-total">0:00</div>
      <div class="progress-wrap"><div class="progress-bar" id="bar-total"></div></div>
    </div>
    <div class="timer-box">
      <div class="timer-label">本頁已用</div>
      <div class="timer-value" id="clock-page">0:00</div>
      <div class="progress-wrap"><div class="progress-bar" id="bar-page" style="background:#5A8270;"></div></div>
    </div>
    <div class="timer-box">
      <div class="timer-label">建議剩餘</div>
      <div class="timer-value good" id="clock-suggest">0:15</div>
      <div class="progress-wrap"><div class="progress-bar" id="bar-suggest"></div></div>
    </div>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" id="btn-start">開始</button>
    <button class="ctrl-btn" id="btn-reset">重設</button>
  </div>
</div>

<div id="slide-nav">
  <button class="nav-btn" id="btn-prev">← 上一頁</button>
  <div id="slide-counter">1 / 13</div>
  <button class="nav-btn" id="btn-next">下一頁 →</button>
</div>

<div id="card">
  <div id="card-header">
    <div><div id="card-part"></div><div id="card-title"></div></div>
    <div id="card-time-badge"></div>
  </div>
  <div id="script-wrap">
    <div id="script-label">逐字稿</div>
    <div id="script"></div>
  </div>
  <div id="cues-wrap">
    <div id="cues-label">重點提示</div>
    <div id="cues"></div>
  </div>
</div>

<div id="bottom-pad"></div>

<script>
const TOTAL_SEC = 7.5 * 60;

const slides = [
  {part:"封面",title:"開場",secs:15,script:"大家好，我是袁翊庭，今天要介紹的論文是許智涵和莊惠君在 2023 年發表的〈國小高年級學生音樂聆聽情緒與偏好之調查研究〉。",cues:["許智涵、莊惠君","2023","臺北市立大學學報"]},
  {part:"Part 1",title:"論文基本資料",secs:45,script:"這篇刊登在臺北市立大學學報人文社會類第 54 卷第 2 期，頁 21 到 46。兩位作者，許智涵是臺北市士東國小的現職教師，莊惠君是臺師大音樂系副教授，一位來自教學現場、一位來自學術界，這個組合讓研究同時兼具實務和學術的深度。研究對象是臺北、新北、臺中、高雄四大都會區各一所國小的五、六年級學生，共 1,032 人。關鍵詞是音樂欣賞、音樂偏好，以及音樂聆聽情緒。",cues:["54(2) 頁 21-46","許智涵實務＋莊惠君學術","1,032 人","三個關鍵詞"]},
  {part:"Part 2",title:"選擇此論文的理由",secs:45,script:"我選這篇有三個理由。第一，它同時涵蓋了音樂引發的行為，也就是聆聽情緒，以及參與音樂的行為，也就是音樂聆聽這件事，完全符合老師課堂上說的音樂心理學定義。第二，研究對象就是台灣國小高年級學生，跟我的教學現場直接相關，讀起來很有共鳴。第三，理論架構清楚，用的是 Russell 的情緒環形模型，研究方法也是問卷調查，不難理解。",cues:["音樂心理學定義（Eagle, 1996）","台灣國小現場","Russell＋問卷"]},
  {part:"Part 3",title:"研究目的與問題",secs:45,script:"這篇的研究目的是瞭解國小高年級學生聆聽音樂欣賞曲時三個面向：第一，他們的聆聽情緒是什麼；第二，他們的音樂偏好是什麼；第三，情緒和偏好之間有什麼關係。對應這三個目的，研究者提出三個待答問題：不同背景的學生，包含年級、性別和人格特質，他們的聆聽情緒、音樂偏好，以及情緒和偏好的關係各是如何。",cues:["目的：情緒、偏好、兩者關係","Q1情緒、Q2偏好、Q3關係","背景：年級、性別、人格"]},
  {part:"Part 4",title:"關鍵名詞定義",secs:45,script:"這篇有三個核心名詞。第一，音樂欣賞，是音樂活動的根本，也是引發個人情緒的重要途徑。第二，音樂偏好，根據 LeBlanc 1984 年的定義，是對特定音樂刺激表明其喜歡的程度，這個反應主觀且瞬間，跟你的音樂知識多不多沒有關係。第三，音樂聆聽情緒，根據 Russell 1980 年的研究，聆聽音樂後產生的情緒反應可以分為正向情緒和負向情緒兩大類。",cues:["音樂欣賞：根本、引發情緒","音樂偏好：LeBlanc 1984，主觀且瞬間，與知識無關","音樂聆聽情緒：Russell 1980，正向／負向"]},
  {part:"Part 5",title:"重要理論與人物",secs:60,script:"這篇引用了四位重要學者。最核心的是 Russell，他在 1980 年提出情緒環形模型，把情緒分成正向和負向兩個維度，是本研究情緒分類的理論基礎，也就是說，這篇論文選用的八種情緒選項，都是從這個模型延伸出來的。第二位是 Bruner，1990 年歸納出音樂最常引發的五類情緒：激動、平靜、嚴肅、快樂和悲傷，這個分類跟本研究的結果非常吻合。第三位是 Juslin 等人，他們在 2011 年讓 706 位受測者自由描述聆聽音樂的感受，發現最常出現的形容詞是「快樂的」，占了超過 50%，負向情緒只有悲傷和生氣兩種，這跟本研究「學生最喜愛快樂情緒曲目」的結論互相呼應。第四位是 Huron，2006 年提出 ITPRA 理論，說明大腦透過想像、張力、預期、動作、評價五個階段來感知和評價音樂，解釋了為什麼人在聽音樂時會有預期和驚喜的感受。",cues:["Russell 1980：情緒環形模型（核心，8種情緒從這延伸）","Bruner 1990：五類情緒","Juslin 2011：706人、快樂超過50%","Huron 2006：ITPRA 五階段"]},
  {part:"Part 6",title:"研究方法",secs:45,script:"研究採用問卷調查法，對象是臺北、新北、臺中、高雄四大都會區各一所國小五、六年級學生，共 1,032 人。資料分析方法包含描述性統計、卡方檢定、t 檢定，以及單因子變異數分析。研究流程分四步驟：先編製問卷，再選定樣本，接著在課堂上播放音樂欣賞曲請學生填答，最後進行統計分析。",cues:["問卷調查法","1,032 人","描述統計、卡方、t、ANOVA","四步驟"]},
  {part:"Part 7",title:"研究工具與實作",secs:45,script:"研究工具分三個部分。第一是音樂聆聽 CD，研究者從國小三到六年級教科書中，挑選兩個以上版本都有收錄的欣賞曲，共 30 首，每首擷取約 50 秒的代表性段落，像是〈給愛麗絲〉、〈小步舞曲〉、〈大黃蜂的飛行〉、〈彼得與狼〉這些曲子都在裡面。第二是音樂偏好與音樂聆聽情緒問卷，情緒題的八個選項，是依據 Hevner 在 1936 年的研究，把 67 個情緒形容詞歸納成八大類而來的：嚴肅、悲傷、夢幻、平靜、幽默、快樂、激動和有活力。偏好題則用五個臉部表情圖示，從哭臉到笑臉，方便學生勾選。問卷在正式施測前也做了預試，確認信度。第三是人格特質量表，採用莊耀嘉、李雯娣在 2001 年編製的「性格自評量表」，共 30 題，測量五大人格向度。右邊的 QR Code 掃描可以連到論文全文。",cues:["CD：30首各約50秒、教科書三到六年級曲目","問卷：Hevner 1936，67個詞→8類情緒","偏好：5等級臉部表情","人格量表：莊耀嘉2001，30題五大人格"]},
  {part:"Part 8",title:"研究結論（1/2）",secs:30,script:"研究共有五個主要發現，先說前三個。第一，30 首樂曲中，一致性最高的是〈大黃蜂的飛行〉，高達 81% 的學生都選「激動」。整體來看，學生最常感受到的情緒是激動、有活力和悲傷。第二，曲速快、大調、管弦樂編制的曲子比較容易讓學生感到激動或有活力，反過來說，速度慢、小調的曲子則比較容易讓學生感到悲傷或平靜，這跟音樂心理學的研究是一致的。第三，學生最喜愛前五名是〈小步舞曲〉、〈給愛麗絲〉、〈胡桃鉗-糖梅仙子〉、〈胡桃鉗-俄羅斯之舞〉、〈軍隊進行曲〉，這些讓學生感到快樂的曲子，偏好也最高。",cues:["〈大黃蜂〉81%選激動","快板大調管弦樂→激動有活力；慢板小調→悲傷平靜","偏好前5名：小步舞曲、給愛麗絲、胡桃鉗糖梅、俄羅斯之舞、軍隊進行曲"]},
  {part:"Part 8",title:"研究結論（2/2）",secs:30,script:"第四個發現關於性別差異。30 首曲子中，有 18 首男女偏好達顯著差異，其中 15 首都是女生偏好高於男生。男生偏好程度高於女生的只有三首：〈號兵的假期〉、〈大黃蜂的飛行〉和〈輕騎兵序曲〉，這三首的共同特徵是速度快、節奏強烈，讓人感到激動有活力；而女生對夢幻、平靜類型的曲子偏好較高。第五個發現是人格特質。30 首曲子中，有 20 首在不同人格特質學生間達顯著偏好差異。事後比較發現，和善性人格在 19 首曲子的偏好顯著高於外傾性，幾乎所有曲目都更喜歡。這個結果和一般直覺不同，通常我們以為外向的人最愛音樂，但研究顯示，溫和有同理心的和善性學生對音樂課曲目的接受度才是最高的。",cues:["18首男女差異、15首女>男","男偏好3首都是快速激動","20首人格差異、和善性19首>外傾性（反直覺！）"]},
  {part:"Part 9",title:"報告心得",secs:30,script:"讀完這篇有三點心得。第一，音樂課選曲不能只靠老師主觀判斷，應考量學生的情緒反應和性別差異。第二，和善性學生偏好最高這個發現推翻了我以為外向學生最愛音樂的直覺，讓我更重視個別差異。第三，這篇只用教科書欣賞曲，未來若加入歌唱曲和直笛曲，用更細緻的情緒詞彙，可以幫助學生更完整表達聆聽感受。",cues:["多元選曲、考量情緒與性別","和善性反直覺、個別差異","研究限制：只有欣賞曲"]},
  {part:"Part 10",title:"參考文獻",secs:10,script:"參考文獻整理如投影片所示，依 APA 格式，中文在前按筆畫、英文在後按字母排序。",cues:["不用逐條唸，帶過就好"]},
  {part:"結語",title:"感謝",secs:10,script:"以上是我的報告，謝謝老師和同學的聆聽，敬請指教。",cues:["微笑、停頓、等提問"]}
];

let current = 0;
let totalElapsed = 0;
let pageElapsed = 0;
let running = false;
let iv = null;

const clockTotal = document.getElementById('clock-total');
const clockPage = document.getElementById('clock-page');
const clockSuggest = document.getElementById('clock-suggest');
const barTotal = document.getElementById('bar-total');
const barPage = document.getElementById('bar-page');
const barSuggest = document.getElementById('bar-suggest');
const btnStart = document.getElementById('btn-start');
const btnReset = document.getElementById('btn-reset');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const counter = document.getElementById('slide-counter');

function fmt(s) {
  const abs = Math.abs(s);
  const str = Math.floor(abs/60) + ':' + String(abs%60).padStart(2,'0');
  return s < 0 ? '-' + str : str;
}

function updateClocks() {
  const suggest = slides[current].secs;
  const remaining = suggest - pageElapsed;

  // 總時間
  clockTotal.textContent = fmt(totalElapsed);
  const totalPct = Math.min((totalElapsed / TOTAL_SEC) * 100, 100);
  barTotal.style.width = totalPct + '%';
  if (totalElapsed >= TOTAL_SEC) {
    barTotal.style.background = '#C0392B';
    clockTotal.className = 'timer-value over';
  } else if (totalElapsed >= TOTAL_SEC * 0.85) {
    barTotal.style.background = '#B86A00';
    clockTotal.className = 'timer-value warn';
  } else {
    barTotal.style.background = '#2E7D57';
    clockTotal.className = 'timer-value';
  }

  // 本頁已用
  clockPage.textContent = fmt(pageElapsed);
  const pagePct = Math.min((pageElapsed / suggest) * 100, 100);
  barPage.style.width = pagePct + '%';
  if (pageElapsed > suggest) {
    barPage.style.background = '#C0392B';
    clockPage.className = 'timer-value over';
  } else if (pageElapsed >= suggest * 0.8) {
    barPage.style.background = '#B86A00';
    clockPage.className = 'timer-value warn';
  } else {
    barPage.style.background = '#5A8270';
    clockPage.className = 'timer-value';
  }

  // 建議剩餘
  clockSuggest.textContent = fmt(remaining);
  const suggestPct = Math.max((remaining / suggest) * 100, 0);
  barSuggest.style.width = suggestPct + '%';
  if (remaining <= 0) {
    barSuggest.style.background = '#C0392B';
    clockSuggest.className = 'timer-value over';
  } else if (remaining <= suggest * 0.2) {
    barSuggest.style.background = '#B86A00';
    clockSuggest.className = 'timer-value warn';
  } else {
    barSuggest.style.background = '#2E7D57';
    clockSuggest.className = 'timer-value good';
  }
}

function render() {
  const s = slides[current];
  counter.textContent = (current+1) + ' / ' + slides.length;
  document.getElementById('card-part').textContent = s.part;
  document.getElementById('card-title').textContent = s.title;
  document.getElementById('card-time-badge').textContent = '建議 ' + s.secs + ' 秒';
  document.getElementById('script').textContent = s.script;
  document.getElementById('cues').innerHTML = s.cues.map(c =>
    '<div class="cue"><div class="cue-dot"></div><span>' + c + '</span></div>'
  ).join('');
  btnPrev.disabled = current === 0;
  btnNext.disabled = current === slides.length - 1;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

btnStart.addEventListener('click', () => {
  if (running) {
    clearInterval(iv); running = false;
    btnStart.textContent = '繼續';
    btnStart.classList.add('paused');
  } else {
    running = true;
    btnStart.textContent = '暫停';
    btnStart.classList.remove('paused');
    iv = setInterval(() => {
      totalElapsed++;
      pageElapsed++;
      updateClocks();
    }, 1000);
  }
});

btnReset.addEventListener('click', () => {
  clearInterval(iv); running = false;
  totalElapsed = 0; pageElapsed = 0; current = 0;
  btnStart.textContent = '開始';
  btnStart.classList.remove('paused');
  render();
  updateClocks();
});

btnPrev.addEventListener('click', () => {
  if (current > 0) { current--; pageElapsed = 0; render(); updateClocks(); }
});

btnNext.addEventListener('click', () => {
  if (current < slides.length - 1) { current++; pageElapsed = 0; render(); updateClocks(); }
});

render();
